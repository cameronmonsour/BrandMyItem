kind = "web"
previewPath = "/"
title = "BrandMyItem"
description = "A client-side marketplace concept where brands fund everyday items by buying logo spots, with live listings, escrow-state demos, owner check-ins, and submission tracking."
version = "1.0.0"
id = "artifacts/brandmyitem"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22686

[services.development]
run = "pnpm --filter @workspace/brandmyitem run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"
PUBLIC_BASE_URL = "https://brandmyitem.com"

[services.production.run]
args = [ "node", "artifacts/api-server/dist/index.mjs" ]

[services.production.run.env]
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/health"


[services.env]
PORT = "22686"
BASE_PATH = "/"
