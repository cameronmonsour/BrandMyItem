openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: campaigns
    description: Public campaign operations
  - name: checkout
    description: Stripe placement reservation and funding operations
  - name: tracking
    description: One-time magic-link campaign and placement tracking
  - name: storage
    description: Durable image upload and serving
  - name: fulfillment
    description: Private fulfillment, proof, shipment, and check-in operations
  - name: contact
    description: Customer support contact operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: sendContactMessage
      tags: [contact]
      summary: Send a customer support message to BrandMyItem support
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactMessageInput" }
      responses:
        "202":
          description: Message accepted for delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactMessageReceipt" }
        "400": { description: Invalid contact message }
        "502": { description: Support email delivery unavailable }
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Public integration health
      description: Returns service status and configured integration modes without exposing credentials.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationHealth"
  /campaigns:
    post:
      operationId: registerCampaign
      tags: [campaigns]
      summary: Register a campaign and its authoritative spot prices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Campaign registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          description: Invalid campaign
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List active real campaigns
      responses:
        "200":
          description: Active campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
  /campaign-drafts:
    post:
      operationId: createCampaignDraft
      tags: [campaigns]
      summary: Create an unpublished, expiring campaign draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignDraftInput" }
      responses:
        "201":
          description: Draft created and owner capability cookie issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignDraft" }
        "400": { description: Invalid draft }
        "409": { description: Campaign ID already exists }
        "429": { description: Too many requests }
  /campaign-drafts/{campaignId}/w9/request-url:
    post:
      operationId: requestCampaignDraftW9Upload
      tags: [campaigns, storage]
      summary: Issue a W-9 upload intent for an authorized high-value draft
      parameters: [{ $ref: "#/components/parameters/CampaignId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/W9UploadRequest" }
      responses:
        "201":
          description: Single-use W-9 upload intent and signed URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/W9UploadIntent" }
        "400": { description: Invalid W-9 metadata or ineligible draft }
        "404": { description: Draft not found or not authorized }
        "429": { description: Too many requests }
  /campaign-drafts/{campaignId}/w9/{intentId}/finalize:
    post:
      operationId: finalizeCampaignDraftW9Upload
      tags: [campaigns, storage]
      summary: Verify and finalize a W-9 upload intent once
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - name: intentId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: W-9 finalized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/W9UploadIntent" }
        "400": { description: Uploaded W-9 is missing or does not match intent metadata }
        "404": { description: Draft or intent not found or not authorized }
        "409": { description: "Intent already finalized, consumed, or expired" }
  /campaign-drafts/{campaignId}/publish:
    post:
      operationId: publishCampaignDraft
      tags: [campaigns]
      summary: Publish an authorized campaign draft
      parameters: [{ $ref: "#/components/parameters/CampaignId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishCampaignDraftInput" }
      responses:
        "200":
          description: Published campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { description: W-9 or social context is required }
        "404": { description: Draft not found or not authorized }
        "409": { description: "Draft expired, already published, or W-9 intent reused" }
  /sponsor-reservation-drafts:
    post:
      operationId: createSponsorReservationDraft
      tags: [checkout]
      summary: Claim one currently open placement briefly and issue a capability cookie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorReservationDraftInput" }
      responses:
        "201":
          description: Expiring reservation draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SponsorReservationDraft" }
        "404": { description: Campaign or spot is unavailable }
        "409": { description: Spot is already being reserved }
        "429": { description: Too many requests }
  /sponsor-reservation-drafts/{draftId}/logo/request-url:
    post:
      operationId: requestSponsorReservationDraftLogoUpload
      tags: [checkout, storage]
      summary: Issue a capability-bound sponsor logo upload intent
      parameters: [{ $ref: "#/components/parameters/ReservationDraftId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorLogoUploadRequest" }
      responses:
        "200":
          description: Single-use logo upload intent and signed URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SponsorLogoUploadIntent" }
        "400": { description: Logo must be an SVG or PDF no larger than 20 MB }
        "404": { description: Draft not found or not authorized }
        "409": { description: Draft expired or unavailable }
  /sponsor-reservation-drafts/{draftId}:
    delete:
      operationId: deleteSponsorReservationDraft
      tags: [checkout]
      summary: Release an authorized unconsumed placement reservation draft
      parameters: [{ $ref: "#/components/parameters/ReservationDraftId" }]
      responses:
        "204":
          description: Reservation draft deleted and spot released
        "404":
          description: Draft not found or not authorized
        "409":
          description: Draft has already been consumed
  /sponsor-reservation-drafts/{draftId}/logo/{intentId}/finalize:
    post:
      operationId: finalizeSponsorReservationDraftLogoUpload
      tags: [checkout, storage]
      summary: Verify and finalize a sponsor logo upload intent once
      parameters:
        - $ref: "#/components/parameters/ReservationDraftId"
        - name: intentId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Logo intent finalized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SponsorLogoUploadIntent" }
        "400": { description: Object metadata does not match the intent }
        "404": { description: Draft or intent not found or not authorized }
        "409": { description: Draft or intent is expired or already used }
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a durable campaign image
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image bytes
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Image not found
  /checkout/sessions:
    post:
      operationId: createPlacementCheckout
      tags: [checkout]
      summary: Create a Stripe SetupIntent reservation session for one campaign placement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementCheckoutInput"
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementCheckoutSession"
        "400":
          description: Invalid or unavailable placement
        "404":
          description: Campaign not found
        "409":
          description: Placement already reserved
  /checkout/sessions/{sessionId}:
    get:
      operationId: getPlacementCheckout
      tags: [checkout]
      summary: Verify an authorized Stripe reservation session
      description: Requires the HttpOnly checkout capability cookie issued when the checkout reservation is created. The session ID alone is not authorization.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Checkout status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementOrder"
        "404":
          description: Checkout session not found or not authorized
  /checkout/reservations/{orderId}/cancel:
    post:
      operationId: cancelPlacementReservation
      tags: [checkout]
      summary: Cancel a placement reservation before funding
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reservation cancelled
        "404":
          description: Reservation not found or not authorized
        "409":
          description: Reservation is already funding or funded
  /checkout/reservations/{orderId}/update-card:
    post:
      operationId: updateReservationCard
      tags: [checkout]
      summary: Open a SetupIntent session to replace a declined funding card
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Card update session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementCheckoutSession"
        "404":
          description: Reservation not found or not authorized
        "409":
          description: Card update window is closed
  /campaigns/{campaignId}/relist:
    post:
      operationId: relistCampaign
      tags: [campaigns]
      summary: Relist an eligible expired campaign once
      parameters:
        - in: path
          name: campaignId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Campaign relisted for 30 days
        "404":
          description: Campaign not found or not authorized
        "409":
          description: Campaign is not eligible for relisting
  /tracking:
    get:
      operationId: getTracking
      tags: [tracking]
      summary: Resolve a one-time tracking link
      description: Requires a one-time magic-link token. Email is never an authorization credential.
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email-linked tracking records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResult"
        "400":
          description: Invalid or expired link
        "401":
           description: Tracking link is invalid, expired, or already used
  /tracking/magic-link:
    post:
      operationId: requestTrackingMagicLink
      tags: [tracking]
      summary: Email a one-time tracking link
      description: Sends a 15-minute, one-time link through the configured transactional email provider. Always returns the same generic response so email addresses and provider delivery failures cannot be enumerated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingMagicLinkInput"
      responses:
        "202":
          description: Generic confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingMagicLinkResponse"
        "400":
          description: Invalid email
        "429":
          description: Too many requests
  /campaigns/{campaignId}/shipping-address:
    put:
      operationId: saveShippingAddress
      tags: [fulfillment]
      summary: Save the owner's private validated US shipping address
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingAddressInput"
      responses:
        "200":
          description: Address saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingAddress"
        "400": { description: Invalid or unsupported address }
        "404": { description: Campaign not found or not authorized }
  /campaigns/{campaignId}/proofs:
    post:
      operationId: submitCampaignProof
      tags: [fulfillment]
      summary: Approve one submitted operator proof revision
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProofApprovalInput"
      responses:
        "201":
          description: Proof submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proof"
        "404": { description: Campaign not found or not authorized }
        "409": { description: Submitted proof revision is no longer available }
  /operator/campaigns/{campaignId}/placement-orders/{placementOrderId}/proofs/request-url:
    post:
      operationId: requestOperatorProductionProofUpload
      tags: [fulfillment, storage]
      summary: Issue an operator-bound production proof upload intent
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/PlacementOrderId"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProofUploadRequest" } } }
      responses:
        "201": { description: Upload intent issued, content: { application/json: { schema: { $ref: "#/components/schemas/ProofUploadIntent" } } } }
        "401": { description: Operator authentication required }
        "409": { description: Placement is not funded }
  /operator/campaigns/{campaignId}/placement-orders/{placementOrderId}/proofs/{intentId}/finalize:
    post:
      operationId: finalizeOperatorProductionProofUpload
      tags: [fulfillment, storage]
      summary: Verify and finalize an operator proof upload once
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/PlacementOrderId"
        - $ref: "#/components/parameters/UploadIntentId"
      responses:
        "200": { description: Upload intent finalized, content: { application/json: { schema: { $ref: "#/components/schemas/ProofUploadIntent" } } } }
        "401": { description: Operator authentication required }
        "409": { description: Intent expired or already finalized }
  /operator/campaigns/{campaignId}/proofs:
    post:
      operationId: submitOperatorCampaignProof
      tags: [fulfillment]
      summary: Submit a finalized proof revision for one funded placement
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/CampaignId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProofSubmissionInput" } } }
      responses:
        "201": { description: Proof revision submitted, content: { application/json: { schema: { $ref: "#/components/schemas/Proof" } } } }
        "401": { description: Operator authentication required }
        "409": { description: Intent or proof revision is no longer available }
  /campaigns/{campaignId}/checkins:
    post:
      operationId: submitCampaignCheckin
      tags: [fulfillment]
      summary: Submit an owner check-in
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinSubmissionInput"
      responses:
        "201":
          description: Check-in submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkin"
        "409": { description: Check-in is not currently due }
  /campaigns/{campaignId}/checkins/photo/request-url:
    post:
      operationId: requestCampaignCheckinPhotoUpload
      tags: [fulfillment, storage]
      summary: Issue an owner-bound photo upload intent for the current check-in cycle
      parameters: [{ $ref: "#/components/parameters/CampaignId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CheckinPhotoUploadRequest" } } }
      responses:
        "201": { description: Upload intent issued, content: { application/json: { schema: { $ref: "#/components/schemas/CheckinPhotoUploadIntent" } } } }
        "409": { description: Check-in is not currently due }
  /campaigns/{campaignId}/checkins/photo/{intentId}/finalize:
    post:
      operationId: finalizeCampaignCheckinPhotoUpload
      tags: [fulfillment, storage]
      summary: Verify and finalize an owner check-in photo upload once
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/UploadIntentId"
      responses:
        "200": { description: Upload intent finalized, content: { application/json: { schema: { $ref: "#/components/schemas/CheckinPhotoUploadIntent" } } } }
        "409": { description: Intent expired or already finalized }
  /campaigns/{campaignId}/make-good:
    post:
      operationId: selectCampaignMakeGood
      tags: [fulfillment]
      summary: Select a make-good after a missed check-in
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MakeGoodInput"
      responses:
        "200": { description: Make-good selected }
        "409": { description: A check-in has not been missed }
  /operator/campaigns/{campaignId}/proofs/approve:
    post:
      operationId: approveCampaignProof
      tags: [fulfillment]
      summary: Approve the current proof revision
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200": { description: Proof approved }
        "401": { description: Operator authentication required }
        "409": { description: No submitted proof }
  /operator/campaigns/{campaignId}/shipment:
    post:
      operationId: recordCampaignShipment
      tags: [fulfillment]
      summary: Record shipment after proof approval
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentInput"
      responses:
        "200": { description: Shipment recorded }
        "401": { description: Operator authentication required }
        "409": { description: Proof approval or shipping address required }
  /operator/campaigns/{campaignId}/delivery:
    post:
      operationId: recordCampaignDelivery
      tags: [fulfillment]
      summary: Record delivery and start the first owner check-in cycle
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: Delivery recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "401": { description: Operator authentication required }
        "409": { description: Campaign is not awaiting delivery }
components:
  securitySchemes:
    operatorBearer:
      type: http
      scheme: bearer
      bearerFormat: API token
  parameters:
    CampaignId:
      in: path
      name: campaignId
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    ReservationDraftId:
      in: path
      name: draftId
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    PlacementOrderId:
      in: path
      name: placementOrderId
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    UploadIntentId:
      in: path
      name: intentId
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactMessageInput:
      type: object
      additionalProperties: false
      required: [name, email, subject, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 320 }
        subject: { type: string, minLength: 1, maxLength: 160 }
        message: { type: string, minLength: 1, maxLength: 5000 }
    ContactMessageReceipt:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    IntegrationHealth:
      type: object
      additionalProperties: false
      required: [ok, stripeMode, resend]
      properties:
        ok: { type: boolean, const: true }
        stripeMode: { type: string, enum: [test, live] }
        resend: { type: boolean }
    CampaignInput:
      type: object
      required: [id, itemType, title, ownerName, ownerEmail, pricesCents, ownerAssent, presentation]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        itemType:
          type: string
          minLength: 1
          maxLength: 50
        title:
          type: string
          minLength: 1
          maxLength: 200
        ownerName:
          type: string
          minLength: 1
          maxLength: 120
        ownerEmail:
          type: string
          format: email
          maxLength: 320
        pricesCents:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: integer
            minimum: 100
            maximum: 10000000
        ownerAssent:
          $ref: "#/components/schemas/OwnerAssent"
        w9ObjectPath:
          type: string
          pattern: "^/objects/uploads/[A-Za-z0-9-]+$"
        presentation:
          type: object
          maxProperties: 32
          propertyNames:
            enum:
              - type
              - sourceType
              - itemName
              - custom
              - photo
              - faces
              - tiles
              - retail
              - title
              - owner
              - avatar
              - habs
              - cities
              - universities
              - purpose
              - freq
              - social
              - color
              - variantModel
              - variantSize
              - source
              - verified
              - socialLinks
              - slots
              - pricesIncludeMarkup
              - postedAt
              - unsoldTimeoutDays
              - termMonths
              - checkinFrequency
              - brandingMode
              - status
              - mtv
          additionalProperties: true
    CampaignDraftInput:
      type: object
      required: [id, itemType, title, ownerName, ownerEmail, pricesCents, ownerAssent, presentation]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        itemType: { type: string, minLength: 1, maxLength: 50 }
        title: { type: string, minLength: 1, maxLength: 200 }
        ownerName: { type: string, minLength: 1, maxLength: 120 }
        ownerEmail: { type: string, format: email, maxLength: 320 }
        pricesCents:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: integer, minimum: 100, maximum: 10000000 }
        ownerAssent: { $ref: "#/components/schemas/OwnerAssent" }
        presentation: { type: object, maxProperties: 32, additionalProperties: true }
    CampaignDraft:
      type: object
      required: [id, status, expiresAt, w9Required]
      properties:
        id: { type: string }
        status: { type: string, enum: [draft] }
        expiresAt: { type: string, format: date-time }
        w9Required: { type: boolean }
    W9UploadRequest:
      type: object
      additionalProperties: false
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 10000000 }
        contentType: { type: string, const: application/pdf }
    W9UploadIntent:
      type: object
      required: [id, purpose, objectPath, expectedMimeType, expectedSizeBytes, expectedFileName, status, expiresAt]
      properties:
        id: { type: string }
        purpose: { type: string, const: campaign_draft_w9 }
        objectPath: { type: string, pattern: "^/objects/uploads/[A-Za-z0-9-]+$" }
        expectedMimeType: { type: string, const: application/pdf }
        expectedSizeBytes: { type: integer }
        expectedFileName: { type: string }
        status: { type: string, enum: [issued, finalized, consumed, revoked] }
        expiresAt: { type: string, format: date-time }
        uploadURL: { type: string, format: uri }
    PublishCampaignDraftInput:
      type: object
      additionalProperties: false
      properties:
        w9IntentId: { type: string, minLength: 1 }
    Campaign:
      type: object
      required: [id, itemType, title, ownerName, pricesCents, presentation, claims, active, lifecycleStatus, relistCount, relistEligible, createdAt]
      properties:
        id:
          type: string
        itemType:
          type: string
        title:
          type: string
        ownerName:
          type: string
        pricesCents:
          type: array
          items:
            type: integer
        presentation:
          type: object
          maxProperties: 32
          additionalProperties: true
        claims:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/PublicClaim"
              - type: "null"
