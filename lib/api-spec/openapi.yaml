openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: campaigns
    description: Public campaign operations
  - name: checkout
    description: Stripe placement checkout operations
  - name: tracking
    description: One-time magic-link campaign and placement tracking
  - name: storage
    description: Durable image upload and serving
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /campaigns:
    post:
      operationId: registerCampaign
      tags: [campaigns]
      summary: Register a campaign and its authoritative spot prices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Campaign registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          description: Invalid campaign
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List active real campaigns
      responses:
        "200":
          description: Active campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a direct image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid image metadata
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a durable campaign image
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image bytes
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Image not found
  /checkout/sessions:
    post:
      operationId: createPlacementCheckout
      tags: [checkout]
      summary: Create a Stripe Checkout session for one campaign placement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementCheckoutInput"
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementCheckoutSession"
        "400":
          description: Invalid or unavailable placement
        "404":
          description: Campaign not found
        "409":
          description: Placement already purchased
  /checkout/sessions/{sessionId}:
    get:
      operationId: getPlacementCheckout
      tags: [checkout]
      summary: Verify an authorized Stripe Checkout session
      description: Requires the HttpOnly checkout capability cookie issued when the checkout reservation is created. The session ID alone is not authorization.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Checkout status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementOrder"
        "404":
          description: Checkout session not found or not authorized
  /tracking:
    get:
      operationId: getTracking
      tags: [tracking]
      summary: Resolve a one-time tracking link
      description: Requires a one-time magic-link token. Email is never an authorization credential.
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email-linked tracking records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResult"
        "400":
          description: Invalid or expired link
        "401":
           description: Tracking link is invalid, expired, or already used
  /tracking/magic-link:
    post:
      operationId: requestTrackingMagicLink
      tags: [tracking]
      summary: Email a one-time tracking link
      description: Always returns the same generic response so email addresses cannot be enumerated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingMagicLinkInput"
      responses:
        "202":
          description: Generic confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingMagicLinkResponse"
        "400":
          description: Invalid email
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CampaignInput:
      type: object
      required: [id, itemType, title, ownerName, ownerEmail, pricesCents, ownerAssent, presentation]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        itemType:
          type: string
          minLength: 1
          maxLength: 50
        title:
          type: string
          minLength: 1
          maxLength: 200
        ownerName:
          type: string
          minLength: 1
          maxLength: 120
        ownerEmail:
          type: string
          format: email
          maxLength: 320
        pricesCents:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: integer
            minimum: 100
            maximum: 10000000
        ownerAssent:
          $ref: "#/components/schemas/OwnerAssent"
        presentation:
          type: object
          additionalProperties: true
    Campaign:
      type: object
      required: [id, itemType, title, ownerName, pricesCents, presentation, claims, active, createdAt]
      properties:
        id:
          type: string
        itemType:
          type: string
        title:
          type: string
        ownerName:
          type: string
        pricesCents:
          type: array
          items:
            type: integer
        presentation:
          type: object
          additionalProperties: true
        claims:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/PublicClaim"
              - type: "null"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    PlacementCheckoutInput:
      type: object
      required: [campaignId, spotIndex, brandName, email, logoObjectPath, brandAssent]
      properties:
        campaignId:
          type: string
          minLength: 1
          maxLength: 100
        spotIndex:
          type: integer
          minimum: 0
          maximum: 19
        brandName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 320
        destinationUrl:
          type: string
          maxLength: 2048
        logoObjectPath:
          type: string
          pattern: "^/objects/uploads/[A-Za-z0-9-]+$"
        brandAssent:
          $ref: "#/components/schemas/BrandAssent"
    OwnerAssent:
      type: object
      required: [accepted, termsVersion, contentVersion, checkinVersion]
      properties:
        accepted:
          type: boolean
          const: true
        termsVersion:
          type: string
        contentVersion:
          type: string
        checkinVersion:
          type: string
    BrandAssent:
      type: object
      required: [accepted, termsVersion, contentVersion]
      properties:
        accepted:
          type: boolean
          const: true
        termsVersion:
          type: string
        contentVersion:
          type: string
    TrackingMagicLinkInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    TrackingMagicLinkResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    PlacementCheckoutSession:
      type: object
      required: [url, orderId, sessionId]
      properties:
        url:
          type: string
          format: uri
        orderId:
          type: string
        sessionId:
          type: string
    PlacementOrder:
      type: object
      required: [id, campaignId, spotIndex, amountCents, status]
      properties:
        id:
          type: string
        campaignId:
          type: string
        spotIndex:
          type: integer
        amountCents:
          type: integer
        status:
          type: string
          enum: [pending, paid, expired, refunding, refunded]
    TrackingOrder:
      type: object
      required: [id, campaignId, spotIndex, amountCents, brandName, email, status, createdAt]
      properties:
        id:
          type: string
        campaignId:
          type: string
        spotIndex:
          type: integer
        amountCents:
          type: integer
        brandName:
          type: string
        email:
          type: string
        destinationUrl:
          type: ["string", "null"]
        logoObjectPath:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, paid, expired, refunding, refunded]
        createdAt:
          type: string
          format: date-time
    TrackingCampaign:
      type: object
      required: [id, itemType, title, ownerName, pricesCents, active, ownerMatch, createdAt, orders]
      properties:
        id:
          type: string
        itemType:
          type: string
        title:
          type: string
        ownerName:
          type: string
        pricesCents:
          type: array
          items:
            type: integer
        active:
          type: boolean
        ownerMatch:
          type: boolean
        createdAt:
          type: string
          format: date-time
        orders:
          type: array
          items:
            $ref: "#/components/schemas/TrackingOrder"
    TrackingResult:
      type: object
      required: [email, campaigns]
      properties:
        email:
          type: string
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/TrackingCampaign"
    PublicClaim:
      type: object
      required: [orderId, spotIndex, brandName, amountCents, purchasedAt]
      properties:
        orderId:
          type: string
        spotIndex:
          type: integer
        brandName:
          type: string
        destinationUrl:
          type: ["string", "null"]
        logoObjectPath:
          type: ["string", "null"]
        amountCents:
          type: integer
        purchasedAt:
          type: string
          format: date-time
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 10000000
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/gif, image/svg+xml]
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
